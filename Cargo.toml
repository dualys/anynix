[package]
name = "anynix"
version = "0.1.0"
edition = "2024"
description = "A any dynamic unix disk"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dualys/anynix"
[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
anyhow = "1"
thiserror = "2"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4"
serde_yaml_ng = "0.10"
tar = "0.4"
zstd = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tough = "0.24"
url = "2"
futures-util = "0.3"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
aws-lc-rs = "1"
jiff = "0.2"
